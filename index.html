<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="description" content="かんたんな質問に答えるだけの職業診断。……と思ったら？">
</head>
<body>
<title>職業診断</title>
<style>
  :root{
    --sky:#5c94fc; --sky2:#8fb7ff;
    --red:#e52521; --green:#43b047; --pipe:#189030;
    --gold:#fbd000; --coin:#f8b800;
    --brick:#c84c0c; --brick2:#a03500;
    --cream:#fff7e6; --ink:#20160c; --line:#3a2a16;
    --pink:#ff77aa; --orange:#ff8c1a; --purple:#8a5cd0;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100vh;
    font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 18% 22%, #fff 0 9px, transparent 10px),
      radial-gradient(circle at 24% 20%, #fff 0 13px, transparent 14px),
      radial-gradient(circle at 30% 23%, #fff 0 8px, transparent 9px),
      radial-gradient(circle at 76% 15%, #fff 0 11px, transparent 12px),
      radial-gradient(circle at 82% 18%, #fff 0 8px, transparent 9px),
      linear-gradient(180deg,var(--sky) 0%, var(--sky2) 78%, #cfe3ff 100%);
    background-repeat:no-repeat;
    display:flex; align-items:center; justify-content:center;
    padding:clamp(14px,3vw,36px) clamp(12px,3vw,36px) 0;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
    position:relative; overflow-x:hidden;
  }
  /* ground brick band */
  body::after{
    content:""; position:fixed; left:0; right:0; bottom:0; height:46px; z-index:0;
    background:
      repeating-linear-gradient(90deg,var(--brick) 0 30px,var(--brick2) 30px 32px),
      repeating-linear-gradient(0deg,var(--brick) 0 22px,var(--brick2) 22px 24px);
    background-blend-mode:multiply;
    border-top:4px solid #5a2a08;
    box-shadow:inset 0 5px 0 rgba(255,255,255,.15);
  }

  .panel{
    width:min(600px,100%); position:relative; z-index:1; margin-bottom:60px;
    background:var(--cream);
    border:5px solid var(--line);
    border-radius:20px;
    padding:clamp(20px,4vw,34px);
    box-shadow:0 10px 0 rgba(0,0,0,.28), 0 22px 40px -12px rgba(0,0,0,.4), inset 0 0 0 3px #fff;
  }

  .badge-q{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--gold); color:#5a3b00; font-weight:800;
    border:3px solid var(--line); border-radius:12px;
    padding:5px 14px; font-size:.82rem; letter-spacing:.02em;
    box-shadow:0 4px 0 rgba(0,0,0,.2);
  }
  .badge-q .q{
    width:20px;height:20px;background:#fff3; border:2px solid #5a3b00; border-radius:5px;
    display:grid;place-items:center;font-size:.8rem;
  }

  h1{
    font-size:clamp(1.9rem,7vw,3rem); margin:0; text-align:center; line-height:1.05;
    letter-spacing:.01em; text-wrap:balance;
    color:#fff; font-weight:900;
    -webkit-text-stroke:2px var(--line);
    text-shadow:0 4px 0 var(--line), 3px 3px 0 var(--line);
  }
  h1 .r{color:var(--red);-webkit-text-stroke:2px var(--line)}
  h1 .g{color:var(--green);-webkit-text-stroke:2px var(--line)}
  .sub{
    text-align:center; font-weight:800; color:var(--pipe); margin:14px 0 0;
    font-size:clamp(.95rem,2.6vw,1.1rem);
  }
  .disc{text-align:center;color:#a08b6a;font-size:.78rem;margin:8px 0 0;font-weight:700}

  .coins{display:flex;justify-content:center;gap:10px;margin:22px 0 6px}
  .coin{
    width:26px;height:26px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ffe680,var(--coin));
    border:3px solid #a06a00; color:#a06a00; font-weight:900;
    display:grid;place-items:center;font-size:.8rem;
    box-shadow:0 3px 0 rgba(0,0,0,.2);
  }
  .coin.spent{opacity:.35;filter:grayscale(.5)}

  .lead{text-align:center; color:#5a4a30; font-weight:600; margin:20px auto 4px; max-width:36ch}

  .start-btn{
    display:block; margin:24px auto 6px; cursor:pointer; font-family:inherit;
    font-size:1.15rem; font-weight:900; color:#fff; letter-spacing:.04em;
    background:var(--red); border:4px solid var(--line); border-radius:16px;
    padding:15px 44px;
    box-shadow:0 6px 0 #8f1512, 0 12px 20px -8px rgba(0,0,0,.4);
    transition:transform .08s, box-shadow .08s;
  }
  .start-btn:hover{transform:translateY(-2px);box-shadow:0 8px 0 #8f1512,0 16px 24px -8px rgba(0,0,0,.45)}
  .start-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #8f1512}
  .start-btn:focus-visible{outline:3px solid var(--pipe);outline-offset:3px}

  .qtext{
    font-size:clamp(1.3rem,4.4vw,1.75rem); font-weight:900; text-align:center;
    margin:16px 0 22px; text-wrap:balance; line-height:1.35; color:var(--ink);
  }
  .opts{display:grid; gap:12px}
  .opt{
    cursor:pointer; font-family:inherit; font-size:1.02rem; font-weight:800;
    text-align:left; color:var(--ink);
    background:#fff; border:4px solid var(--line); border-radius:14px;
    padding:14px 16px; display:flex; align-items:center; gap:14px;
    box-shadow:0 5px 0 rgba(0,0,0,.18);
    transition:transform .08s, box-shadow .08s, background .1s;
  }
  .opt:hover{transform:translateY(-2px); background:#fffdf5; box-shadow:0 7px 0 rgba(0,0,0,.2)}
  .opt:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.18)}
  .opt:focus-visible{outline:3px solid var(--pipe);outline-offset:2px}
  .opt .dot{flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--line);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
  .opt .emj{flex:none;font-size:1.5rem;width:32px;text-align:center}

  .back{
    display:block; margin:20px auto 0; background:none; border:0; cursor:pointer;
    color:#8a7350; font-family:inherit; font-weight:800; font-size:.85rem;
  }
  .back:hover{color:var(--pipe)}
  .back:focus-visible{outline:2px solid var(--pipe);outline-offset:2px}

  /* result */
  .result{animation:pop .45s cubic-bezier(.2,1.5,.5,1) both}
  .rtop{text-align:center; font-weight:900; color:var(--pipe); letter-spacing:.14em; font-size:.8rem; margin:0 0 6px}
  .hero{
    display:flex; flex-direction:column; align-items:center; text-align:center;
    background:linear-gradient(180deg,#fff,#fff4dc);
    border:4px solid var(--line); border-radius:18px; padding:22px 18px 20px;
    box-shadow:inset 0 0 0 3px #fff, 0 6px 0 rgba(0,0,0,.15);
  }
  .charbadge{
    width:112px;height:112px;border-radius:24px; overflow:hidden;
    border:5px solid var(--line); background:#fbf3e2;
    box-shadow:0 6px 0 rgba(0,0,0,.25), inset 0 0 0 3px rgba(0,0,0,.06);
    margin-bottom:4px;
    animation:bob 2.2s ease-in-out infinite;
  }
  .charbadge svg{display:block;width:100%;height:100%}
  .youare{font-weight:800;color:#a08b6a;font-size:.85rem;margin:10px 0 0}
  .cname{
    font-size:clamp(1.9rem,7vw,2.6rem); font-weight:900; margin:2px 0 0; line-height:1.1;
    color:#fff; -webkit-text-stroke:2px var(--line);
    text-shadow:0 3px 0 var(--line);
  }
  .ctag{font-weight:800; margin:10px 0 0; font-size:1rem}
  .cdesc{color:#4a3b26; font-weight:600; margin:14px 0 0; max-width:40ch}

  .facts{display:grid; gap:10px; margin:18px 0 0; text-align:left; width:100%; max-width:400px}
  .fact{
    display:flex; gap:12px; align-items:baseline;
    background:#fff; border:3px solid var(--line); border-radius:12px; padding:10px 14px;
    box-shadow:0 4px 0 rgba(0,0,0,.14);
  }
  .fact .k{flex:none; font-weight:900; color:var(--pipe); font-size:.78rem; width:5.5em}
  .fact .v{font-weight:700; color:var(--ink); font-size:.95rem}

  .again{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:22px}
  .again button{
    cursor:pointer;font-family:inherit;font-weight:900;font-size:1rem;color:#fff;
    border:4px solid var(--line);border-radius:14px;padding:12px 26px;
    box-shadow:0 5px 0 rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s;
  }
  .again button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
  .again .r1{background:var(--green);box-shadow:0 5px 0 #2c7a2f}
  .again .r1:active{box-shadow:0 2px 0 #2c7a2f}
  .again .r2{background:var(--orange);box-shadow:0 5px 0 #b85e00}
  .again .r2:active{box-shadow:0 2px 0 #b85e00}
  .again button:focus-visible{outline:3px solid var(--red);outline-offset:3px}

  .foot{text-align:center;color:#9c8663;font-size:.72rem;font-weight:700;margin:20px 0 0}

  /* loading */
  .loadwrap{padding:34px 10px 30px; text-align:center}
  .spinner{
    width:58px;height:58px;margin:0 auto 20px;border-radius:50%;
    border:7px solid #e7d9b8; border-top-color:var(--red);
    animation:spin .9s linear infinite;
  }
  .loadtitle{font-weight:900; font-size:1.2rem; color:var(--ink); margin:0}
  .dots i{animation:blink 1s infinite}
  .dots i:nth-child(2){animation-delay:.2s}
  .dots i:nth-child(3){animation-delay:.4s}
  .lbar{
    height:18px; max-width:280px; margin:18px auto 10px; overflow:hidden;
    background:#fff; border:3px solid var(--line); border-radius:10px;
    box-shadow:0 3px 0 rgba(0,0,0,.14);
  }
  .lbar-fill{height:100%; width:0;
    background:repeating-linear-gradient(45deg,var(--gold) 0 12px,var(--coin) 12px 24px);
    transition:width .12s linear}
  .loadsub{color:#8a7350; font-weight:700; font-size:.86rem; margin:0}

  /* surprise reveal */
  .surprise-tag{
    display:inline-block; margin:0 auto 4px; position:relative; left:50%; transform:translateX(-50%);
    font-weight:900; font-size:1.05rem; color:#fff; letter-spacing:.02em;
    background:var(--red); border:4px solid var(--line); border-radius:14px;
    padding:8px 22px; box-shadow:0 5px 0 #8f1512;
    animation:wobble .6s ease-in-out 2;
  }
  .surprise-wrap{text-align:center; margin-bottom:12px}

  .hidden{display:none !important}

  @keyframes pop{0%{opacity:0;transform:scale(.7) rotate(-6deg)}60%{opacity:1;transform:scale(1.08) rotate(3deg)}100%{opacity:1;transform:none}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
  @keyframes wobble{0%,100%{transform:translateX(-50%) rotate(0)}25%{transform:translateX(-50%) rotate(-4deg)}75%{transform:translateX(-50%) rotate(4deg)}}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .qfade{animation:rise .32s ease both}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>

<div class="panel">
  <!-- START -->
  <section id="start">
    <div style="text-align:center"><span class="badge-q"><span class="q">?</span>WORK APTITUDE</span></div>
    <h1 style="margin-top:14px">職業<span class="r">診断</span></h1>
    <p class="sub">かんたんな質問に答えるだけ。<br>あなたに“向いている職業”を診断します。</p>
    <p class="lead">直感でポチッと選んでいってください。<br>結果は……お楽しみに。</p>
    <button class="start-btn" id="beginBtn">▶ 診断をはじめる</button>
    <p class="foot">所要 1〜2分 ・ 全 2 問</p>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
      <span class="badge-q"><span class="q">?</span><span id="qlabel">しつもん 1</span></span>
      <div class="coins" id="coins" style="margin:0"></div>
    </div>
    <div id="qmount"></div>
    <button class="back hidden" id="backBtn">← もどる</button>
  </section>

  <!-- LOADING -->
  <section id="loading" class="hidden">
    <div class="loadwrap">
      <div class="spinner"></div>
      <p class="loadtitle">あなたの適職を分析中<span class="dots"><i>.</i><i>.</i><i>.</i></span></p>
      <div class="lbar"><div class="lbar-fill" id="lbarFill"></div></div>
      <p class="loadsub" id="loadsub">性格の傾向を照合しています</p>
    </div>
  </section>

  <!-- RESULT -->
  <section id="result" class="hidden">
    <p class="rtop">＼ しんだんけっか ／</p>
    <div id="resMount"></div>
    <div class="again">
      <button class="r1" id="retryBtn">もう一回！</button>
      <button class="r2" id="allBtn">全キャラを見る</button>
    </div>
    <p class="foot">コインは何枚でも集めよう。ゲームは何度でも遊べる。</p>
  </section>
</div>

<script>
(function(){
  "use strict";

  // ---- characters ----
  const CH = {
    mario:{n:"マリオ", e:"🍄", bg:"#e52521", tag:"みんなのヒーロー、赤の主人公。", desc:"とりあえず先頭を走る主人公気質。むずかしいことは考えず、ジャンプで乗り越える。ヒゲはトレードマーク。",
      skill:"無限ジャンプ", line:"「イッツ・ミー！」", pal:"ルイージ / ピーチ"},
    luigi:{n:"ルイージ", e:"👻", bg:"#43b047", tag:"縁の下の、たよれる二番手。", desc:"ちょっとビビりだけど誠実。実はジャンプ力はファミリー最強。お化けだけは本気で苦手。",
      skill:"だいジャンプ", line:"「ヒュ〜…だいじょうぶかな…」", pal:"マリオ / キノピオ"},
    yoshi:{n:"ヨッシー", e:"🥚", bg:"#43b047", tag:"なんでも飲み込む、緑の相棒。", desc:"舌が武器、卵が特技、乗り心地は保証つき。恐竜だけど恐くない。困った時に一番ほしい仲間。",
      skill:"ベロで丸のみ", line:"「タマゴ、産んどくね！」", pal:"マリオ / ピーチ"},
    link:{n:"リンク", e:"⚔️", bg:"#2e8b3d", tag:"〔隠しキャラ〕そもそも別ゲーの勇者。", desc:"緑の服・剣と盾。「恐竜より冒険」を選ぶとまさかの登場。マリオファミリーではないが、スマブラでは家族同然。ツッコミ枠。",
      skill:"マスターソード", line:"「…（無言でうなずく）」", pal:"ゼルダ / (ここじゃない世界)"},
    peach:{n:"ピーチ姫", e:"👑", bg:"#ff77aa", tag:"面倒見のいい、まとめ役。", desc:"さらわれても動じない肝っ玉のお姫様。パラソルでふわり、ハートで回復。実はチームの精神的支柱。",
      skill:"ふわりパラソル", line:"「まかせてちょうだい♪」", pal:"デイジー / キノピオ"},
    daisy:{n:"デイジー", e:"🌼", bg:"#ff8c1a", tag:"元気印のムードメーカー。", desc:"スポーツ大会でいちばん声がでかい。明るくてまっすぐ、ノリで場を回す太陽キャラ。",
      skill:"ハッスルダッシュ", line:"「Hi! I'm DAISY!」", pal:"ピーチ / ヨッシー"},
    toadette:{n:"キノピコ", e:"🎀", bg:"#ff5c8d", tag:"ピンクのキノコ、好奇心の塊。", desc:"探検と発掘が大好きな元気娘。小さな体でどこへでも。冠を拾うと化ける（諸説あり）。",
      skill:"たからさがし", line:"「なにか見つけた！」", pal:"キノピオ / ピーチ"},
    toad:{n:"キノピオ", e:"🍄", bg:"#f2f2f2", tag:"縁の下の、たよれる情報屋。", desc:"小回りがきいて足も速い、みんなの世話役。名言製造機でもある。頭のキノコは本体らしい。",
      skill:"ダッシュ全力疾走", line:"「姫は別の城におられます！」", pal:"ピーチ / キノピコ"},
    wario:{n:"ワリオ", e:"💰", bg:"#fbd000", tag:"金と欲望に、どこまでも忠実。", desc:"力もパワーもガメつさも一級品。ニンニクでパワーアップ。悪役かと思いきや、憎めないパワー系。",
      skill:"ヒップアタック", line:"「ワリオだ！金だ！」", pal:"ワルイージ / (お宝)"},
    waluigi:{n:"ワルイージ", e:"🍆", bg:"#8a5cd0", tag:"こそこそ登場、二番手の二番手。", desc:"ヒョロっと現れ「ワァ〜」と自己主張。本編主役はまだ遠いが、テニスとゴルフでは主役級。哀愁が魅力。",
      skill:"いやがらせ全般", line:"「ワァ〜ルイージ！」", pal:"ワリオ / (出番)"},
    rosalina:{n:"ロゼッタ", e:"⭐", bg:"#22a0a0", tag:"星々を見守る、達観の姉御。", desc:"宇宙の彼方からやってきた神秘系。チコを従え、いつも冷静。スケールがひとりだけ違う。",
      skill:"スタービット", line:"「星の巡りに、まかせましょう」", pal:"ピーチ / (宇宙)"},
    bowser:{n:"クッパ", e:"🐢", bg:"#ff8c1a", tag:"デカくて強い、憎めない大魔王。", desc:"とにかく暴れてお姫様をさらう。でも根はさみしがりで子煩悩。ボスの風格はファミリーいち。",
      skill:"だいばくえん", line:"「グワッハッハ！」", pal:"クッパJr. / (城)"},
    bowserjr:{n:"クッパJr.", e:"🖌️", bg:"#ff6a00", tag:"ちいさな、暴れん坊将軍。", desc:"筆と落書きで大暴れ。パパ大好きな甘えん坊。生意気だけど、やるときはやる次世代エース。",
      skill:"まほうのふで", line:"「パパのためなら！」", pal:"クッパ / (いたずら)"},
    dk:{n:"ドンキーコング", e:"🍌", bg:"#8a5a2b", tag:"バナナとパンチの、陽キャゴリラ。", desc:"ネクタイ一丁でパワー全開。細かいことは気にしない、笑って殴って解決する頼れる巨漢。",
      skill:"ジャイアントパンチ", line:"「ウホッ！」", pal:"ディディー / (バナナ)"}
  };

  // ---- decision tree ----
  // node: {type:"q", label, q, opts:[{t, emj?, dot?, to}]}  to = "q:key" or "r:charId"
  const NODES = {
    color:{ q:"まず…キミの好きな色は？", opts:[
      {t:"赤！ 情熱の赤でしょ", dot:"#e52521", to:"r:mario"},
      {t:"緑。 落ち着くんだよね", dot:"#43b047", to:"q:green"},
      {t:"ピンク。 かわいいの正義", dot:"#ff77aa", to:"q:pink"},
      {t:"黄色！ ギラギラいきたい", dot:"#fbd000", to:"r:wario"},
      {t:"紫…だな（ニヤリ）", dot:"#8a5cd0", to:"r:waluigi"},
      {t:"それ以外", dot:"linear-gradient(135deg,#e52521,#fbd000,#43b047,#5c94fc)", to:"q:other"} ]},

    green:{ q:"恐竜は…好き？", opts:[
      {t:"大好き！ 乗って走りたい", emj:"🦖", to:"r:yoshi"},
      {t:"うーん、兄のそばが落ち着く", emj:"👻", to:"r:luigi"},
      {t:"恐竜より、剣と盾かな…", emj:"⚔️", to:"r:link"} ]},

    pink:{ q:"どっちかというと？", opts:[
      {t:"おっとり優雅に、お姫様", emj:"👑", to:"r:peach"},
      {t:"元気に探検、お宝みつける", emj:"🎀", to:"r:toadette"} ]},

    other:{ q:"じゃあ…憧れの立ち位置は？", opts:[
      {t:"主役を、陰で支えたい", emj:"🍄", to:"r:toad"},
      {t:"明るく、場を盛り上げたい", emj:"🌼", to:"r:daisy"},
      {t:"力こそパワー、豪快に！", emj:"🍌", to:"r:dk"},
      {t:"俗世を離れ、達観したい", emj:"⭐", to:"r:rosalina"},
      {t:"世界を、我が手に…！", emj:"🐢", to:"q:boss"} ]},

    boss:{ q:"どんな悪党になりたい？", opts:[
      {t:"デカくて強い、大魔王", emj:"🐢", to:"r:bowser"},
      {t:"生意気な、ちいさな暴れん坊", emj:"🖌️", to:"r:bowserjr"} ]}
  };

  const $=s=>document.querySelector(s);
  const start=$("#start"),quiz=$("#quiz"),loading=$("#loading"),result=$("#result");
  const qmount=$("#qmount"),coins=$("#coins"),qlabel=$("#qlabel"),backBtn=$("#backBtn");

  let path=[];       // stack of node keys visited (questions only)
  let cur="color";

  function show(el){[start,quiz,loading,result].forEach(x=>x.classList.add("hidden"));el.classList.remove("hidden");}

  function renderCoins(active){
    // show a coin per answered + current; keeps it playful, not a hard count
    const total=Math.max(2, path.length+1);
    let html="";
    for(let i=0;i<total;i++){
      const done=i<path.length;
      html+='<span class="coin'+(done?"":" spent")+'">'+(done?"★":"?")+'</span>';
    }
    coins.innerHTML=html;
  }

  function renderQ(key){
    cur=key;
    const n=NODES[key];
    qlabel.textContent="しつもん "+(path.length+1);
    renderCoins();
    backBtn.classList.toggle("hidden", path.length===0);
    const opts=n.opts.map((o,i)=>{
      const icon=o.emj?('<span class="emj">'+o.emj+'</span>')
                       :('<span class="dot" style="background:'+(o.dot||"#ccc")+'"></span>');
      return '<button class="opt" data-i="'+i+'">'+icon+'<span>'+o.t+'</span></button>';
    }).join("");
    qmount.innerHTML='<div class="qfade"><p class="qtext">'+n.q+'</p><div class="opts">'+opts+'</div></div>';
    qmount.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>pick(n.opts[+b.dataset.i].to)));
  }

  function pick(to){
    path.push(cur);
    if(to.slice(0,2)==="r:") showResult(to.slice(2));
    else renderQ(to.slice(2));
  }

  backBtn.addEventListener("click",()=>{
    if(path.length){ const prev=path.pop(); renderQ(prev); }
  });

  function charCard(id){
    const c=CH[id];
    return ''+
    '<div class="hero">'+
      '<div class="charbadge"><svg viewBox="0 0 100 100" aria-hidden="true">'+AV(id)+'</svg></div>'+
      '<p class="youare">あなたに向いている職業は…</p>'+
      '<h2 class="cname" style="color:'+c.bg+'">'+c.n+'</h2>'+
      '<p class="ctag" style="color:'+c.bg+'">'+c.tag+'</p>'+
      '<p class="cdesc">'+c.desc+'</p>'+
      '<div class="facts">'+
        '<div class="fact"><span class="k">とくぎ</span><span class="v">'+c.skill+'</span></div>'+
        '<div class="fact"><span class="k">きめゼリフ</span><span class="v">'+c.line+'</span></div>'+
        '<div class="fact"><span class="k">相性バツグン</span><span class="v">'+c.pal+'</span></div>'+
      '</div>'+
    '</div>';
  }

  function showResult(id){
    show(loading);
    window.scrollTo({top:0});
    runAnalysis(function(){ reveal(id); });
  }

  function runAnalysis(done){
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches;
    const fill=$("#lbarFill"), sub=$("#loadsub");
    const msgs=["性格の傾向を照合しています","適性データを分析しています","あなたの天職を探しています","まもなく結果が出ます…"];
    if(reduce){ setTimeout(done,300); return; }
    let p=0, mi=0; fill.style.width="0%";
    const t=setInterval(function(){
      p += 4 + Math.random()*7; if(p>100) p=100;
      fill.style.width=p+"%";
      const nm=Math.min(msgs.length-1, Math.floor(p/26));
      if(nm!==mi){ mi=nm; sub.textContent=msgs[nm]; }
      if(p>=100){ clearInterval(t); setTimeout(done,400); }
    },120);
  }

  function reveal(id){
    $(".rtop").textContent="＼ あなたにピッタリの“職業”は…！？ ／";
    $("#allBtn").classList.remove("hidden");
    $("#resMount").innerHTML=
      '<div class="result"><div class="surprise-wrap"><span class="surprise-tag">🎮 まさかの…！？</span></div>'
      +charCard(id)+'</div>';
    show(result);
    window.scrollTo({top:0});
  }

  $("#allBtn").addEventListener("click",()=>{
    $(".rtop").textContent="＼ ぜんキャラずかん ／";
    $("#allBtn").classList.add("hidden");
    const ids=Object.keys(CH);
    $("#resMount").innerHTML='<div style="display:grid;gap:16px">'+ids.map(charCard).join("")+'</div>';
    window.scrollTo({top:0});
  });

  $("#beginBtn").addEventListener("click",()=>{path=[];renderQ("color");show(quiz);});
  $("#retryBtn").addEventListener("click",()=>{path=[];show(start);});
